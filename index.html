<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Ascea</title>
    <meta name="description" content="Ascea for Canadian high-school students: log what you do, plan your school week, match real scholarships and draft applications in your own words." />
    <!-- The web app is for signed-in use; the landing page at ascea.ca is what search engines should show. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F3F8F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070F1A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ascea" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #f3f8f6;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #070f1a;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="ascea-web">
      /* Scrollbars: thin and rounded, a soft grey that works on light and dark, no arrow buttons. */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(128, 142, 162, 0.4) transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(128, 142, 162, 0.4);
        border: 3px solid transparent;
        background-clip: content-box;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(128, 142, 162, 0.65);
      }
      ::-webkit-scrollbar-button {
        display: none;
      }
      /* Text fields: no browser outline; a mint border and soft ring while typing. */
      input,
      textarea {
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #2fd6a3 !important;
        box-shadow: 0 0 0 3px rgba(47, 214, 163, 0.22);
      }
      /* The browser's own date and time pickers (DateField on the web). */
      input.ascea-when::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.7;
      }
      input.ascea-when::-webkit-calendar-picker-indicator:hover {
        opacity: 1;
      }
    </style>
  <link rel="icon" href="/favicon.ico"/></head>
